# AI Playground defaults. Override per venue with `--config venue.toml`; only the keys you set
# are replaced (deep merge). Unknown keys are an error.

[camera]
index = 0
width = 640
height = 480
fps = 30
mjpg_on_linux = true      # many webcams only reach 30 FPS uncompressed at low resolutions
open_timeout_s = 3.0      # no frames within this time -> full-screen error

[recognizer]
model_path = "assets/models/gesture_recognizer.task"
num_hands = 2
min_hand_detection_confidence = 0.5
min_hand_presence_confidence = 0.5
min_tracking_confidence = 0.5

[tracking]
min_hand_size = 0.08      # wrist->middle-MCP / image height; smaller hands are bystanders
match_gate = 0.25         # max wrist distance (normalized) to match a detection to a track
grace_frames = 4          # frames a track survives without a detection
handedness_window = 15    # majority vote over this many frames

# One Euro filter. Units differ per landmark set, so beta does too: image landmarks move in
# normalized units/s (~1 for a fast sweep), world landmarks in metres/s (~0.3 for a fast pinch).
[tracking.one_euro.image]
min_cutoff = 1.0
beta = 10.0
d_cutoff = 1.0

[tracking.one_euro.world]
min_cutoff = 3.0          # lighter than image: pinch_start must fire within 2 frames
beta = 60.0
d_cutoff = 1.0

[gestures.pinch]
# Tuned on tests/fixtures: real closed pinches measure 0.10-0.33, a held pinch drifts up to 0.42
# while the hand moves, open hands stay above 0.47 (p1).
enter = 0.35              # pinch_ratio below this starts a pinch...
exit = 0.50               # ...and above this ends it (hysteresis)
min_frames = 2            # consecutive frames needed to change state; 1 lets fists through
block_on_fist = true      # no pinch_start while MediaPipe sees Closed_Fist this frame
min_index_extension = 0.98  # no pinch_start while the index curls (fist: < 0.95, pinch: >= 1.02)

[gestures.builtin]
min_score = 0.6
start_frames = 3
end_frames = 3

[gestures.fingers]
tip_pip_ratio = 1.2         # non-thumb finger extended: tip->wrist / PIP->wrist above this
thumb_tip_pinky_dist = 0.85 # thumb extended: tip->pinky MCP above this, in palm lengths

[gestures.velocity]
window_s = 0.1

[display]
width = 1280
height = 720
fullscreen = false
display_index = 0
target_fps = 60

[hud]
visible = true
keys_visible = true       # the K overlay listing operator keys; set false at a venue
latency_window_s = 2.0

[physics]
gravity_factor = 1.6      # gravity = this x window height, in px/s^2 (same feel at any resolution)
steps_per_second = 120    # fixed physics timestep
max_substeps = 4          # per rendered frame; a slow frame drops time instead of spiralling
elasticity = 0.6
friction = 0.6
max_bodies = 40           # spawning one more fades out the oldest
fade_s = 0.5
sleep_time_s = 0.5        # resting bodies stop being simulated
max_speed = 4.0           # throw speed cap in window heights/s (no tunnelling through walls)
max_rise = 1.0            # a throw rises at most this many window heights, so it comes back fast
hand_follow_s = 0.033     # hand bodies reach the tracked palm over this (~1 camera frame)

[geometry]
min_size = 0.03           # shape radius when a pinch starts, in window heights...
max_size = 0.12           # ...growing to this while the pinch is held
inflate_s = 1.5
throw_gain = 1.0          # release velocity multiplier
background_brightness = 0.25
choose_frames = 5         # the other hand's finger count must hold this long to choose a shape
choose_min_pinch_ratio = 0.73  # ignore a hand closing in on a pinch (deliberate counts >= 0.77,
                               # a hand on its way into a pinch <= 0.70, measured on fixtures)
stretch_max_size = 0.3    # two-hand stretch: largest radius, in window heights
stretch_gain = 0.5        # radius = this x half the pinch distance (hands are ~0.7-1.3 apart)
paddle_scale = 1.0        # open-hand paddle radius = this x the hand's palm length on screen
paddle_after_pinch_s = 0.4  # no paddle this soon after the hand ends a pinch (MediaPipe's
                            # Open_Palm can return within 0.0-0.06 s, before the shape falls clear)
grab_reach = 0.09         # a fist grabs a shape whose edge is within this, in window heights
                          # (a natural fist grab in recordings/grab_attempts landed at 0.064)
pinch_grab_reach = 0.06   # a pinch this close to a shape (or inside it) grabs it instead of
                          # making a new one: natural grabs look like pinches. Claw grab: 0.039;
                          # deliberate creation pinches: >= 0.35 from any shape (fixtures)
paddle_hold_s = 0.4       # hold an open palm this long before it becomes a paddle
clear_hold_s = 1.5        # hold both fists this long to clear all shapes
throw_lookback_s = 0.15   # opening a fist throws with the fastest velocity from this window:
                          # fist_end lands 70-130 ms after the fingers open (fist_palm_cycle)

[effects]
enabled = true            # glow and particles; E toggles them (cursors and previews always show)
particle_cap = 1500       # pooled; when full, the particles closest to dying are reused
glow_scale = 1.7          # halo radius = this x shape radius
glow_intensity = 0.45     # additive halo brightness at its centre, 0..1
impact_min_dv = 0.35      # sparks when a hit changes a shape's speed by more than this
                          # (window heights/s); gentle settling in the pile stays quiet
impact_max_particles = 24 # sparks per impact at most (scaled by how hard the hit was)
burst_particles = 30      # per shape when both fists clear the screen
release_particles = 12    # small burst where a new shape is released
