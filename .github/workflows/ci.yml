name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Ubuntu)
        if: runner.os == 'Linux'
        # mediapipe imports sounddevice, whose Linux wheels don't bundle PortAudio. Ubuntu's
        # PortAudio fails to initialize (and so `import mediapipe` fails) when no PulseAudio
        # server is running, so the headless runner gets a silent one with a null sink.
        # MediaPipe's native library loads EGL/GLES even when inference runs on the CPU.
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libgl1 libegl1 libgles2 pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: assets/models
          key: models-${{ hashFiles('scripts/fetch_models.py') }}

      - run: uv sync --locked
      - run: uv run python scripts/fetch_models.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -ra
