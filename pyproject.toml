[project]
name = "ai-playground"
version = "0.0.0"
description = "Hand-tracking exhibit that gets students curious about data science and ML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.2.0",
    "pygame-ce>=2.5",
    "pymunk>=7.3.1",
]

[project.scripts]
ai-playground = "ai_playground.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_playground"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # specs hold illustrative code blocks; leave them as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# pygame must be imported before cv2/mediapipe (see the comment in the file).
"src/ai_playground/__main__.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
